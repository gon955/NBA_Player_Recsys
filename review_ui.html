<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recommendation review</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0f172a; --panel: #111c33; --card: #16223d; --line: #26344f;
    --text: #e2e8f0; --muted: #94a3b8; --accent: #6366f1; --flag: #f43f5e; --ok: #10b981;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--text);
         display: grid; grid-template-columns: 260px 1fr; height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex;
          flex-direction: column; min-height: 0; }
  .progress { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .progress h1 { font-size: 15px; margin: 0 0 6px; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 6px 0; }
  .bar div { height: 100%; background: var(--ok); width: 0; transition: width .2s; }
  .muted { color: var(--muted); font-size: 12px; }
  #queue { list-style: none; margin: 0; padding: 6px 0; overflow-y: auto; flex: 1; }
  #queue li { padding: 7px 16px; cursor: pointer; display: flex; justify-content: space-between;
              align-items: center; gap: 8px; }
  #queue li:hover { background: #1b2847; }
  #queue li.active { background: #23315a; border-left: 3px solid var(--accent); padding-left: 13px; }
  #queue li.done .name { color: var(--muted); }
  #queue li.done .name::before { content: "✓ "; color: var(--ok); }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 9px; background: var(--flag); color: white; }
  main { overflow-y: auto; padding: 20px 28px 80px; }
  header.team { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px;
                margin-bottom: 14px; }
  header.team h2 { margin: 0; font-size: 22px; }
  .context { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 6px; }
  .context span b { color: var(--text); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 12px 14px; margin-bottom: 10px; }
  .card.flagged { border-color: var(--flag); box-shadow: inset 3px 0 0 var(--flag); }
  .top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .player { font-size: 16px; font-weight: 600; }
  .facts { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 13px; margin-top: 3px; }
  .facts b { color: var(--text); font-weight: 500; }
  .elsewhere { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .reasons { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .reasons label { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
                   border: 1px solid var(--line); border-radius: 16px; cursor: pointer;
                   font-size: 13px; user-select: none; }
  .reasons label:hover { border-color: var(--muted); }
  .reasons input { accent-color: var(--flag); margin: 0; }
  .reasons label.on { border-color: var(--flag); background: #3b1626; }
  .row2 { display: flex; gap: 8px; margin-top: 8px; }
  .row2 input[type=text] { flex: 1; background: var(--bg); border: 1px solid var(--line); color: var(--text);
                           border-radius: 6px; padding: 6px 9px; font: inherit; }
  button { background: var(--line); color: var(--text); border: 0; border-radius: 6px; padding: 7px 12px;
           font: inherit; cursor: pointer; }
  button:hover { background: #33446a; }
  button.primary { background: var(--accent); }
  button.primary:hover { background: #7c7ff2; }
  button[hidden] { display: none; }
  footer { position: fixed; bottom: 0; left: 260px; right: 0; background: var(--panel);
           border-top: 1px solid var(--line); padding: 10px 28px; display: flex; gap: 10px; align-items: center; }
  footer .spacer { flex: 1; }
  #status { font-size: 12px; color: var(--muted); }
  #status.err { color: var(--flag); }
  .legend { margin: 0 0 14px; color: var(--muted); font-size: 12px; }
  .legend b { color: var(--text); }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 9px; margin-left: 8px; vertical-align: middle; }
  .tag.new { background: var(--accent); color: white; }
  .tag.ok { background: #13322a; color: var(--ok); }
  .badge.new { background: var(--accent); }
  .removed { margin-top: 22px; }
  .removed h3 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 0 0 8px; }
  .removed .card { opacity: .8; }
  .removed .why { color: var(--flag); font-size: 13px; margin-top: 4px; }
  #apply[disabled] { opacity: .5; cursor: default; }
</style>
</head>
<body>
<aside>
  <div class="progress">
    <h1>Review</h1>
    <div class="bar"><div id="bar"></div></div>
    <div class="muted" id="progressText"></div>
  </div>
  <ul id="queue"></ul>
</aside>
<main>
  <header class="team">
    <div>
      <h2 id="teamName"></h2>
      <div class="context muted" id="context"></div>
    </div>
  </header>
  <p class="legend" id="legend"></p>
  <div id="cards"></div>
</main>
<footer>
  <button id="prev">← Prev</button>
  <button id="next">Next →</button>
  <span class="spacer"></span>
  <span id="status"></span>
  <button id="apply" title="Rebuild the served lists with your flags removed (about a minute)">Apply flags</button>
  <button class="primary" id="done">Mark reviewed &amp; next</button>
</footer>
<script>
"use strict";
let rows = [], removed = [], reasons = {}, teams = [], current = 0, jsonPath = "";
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
};
const codes = (r) => (r.reason || "").split(";").filter(Boolean);
const num = (v, d = 1) => (v === "" || v == null || isNaN(+v)) ? "—" : (+v).toFixed(d);
const signed = (v) => (v === "" || v == null || isNaN(+v)) ? "—" : ((+v >= 0 ? "+" : "") + (+v).toFixed(1));
const keyOf = (r) => ({ season: +r.season, TeamId: +r.TeamId, player_id: r.player_id });

function setStatus(text, err = false) {
  const s = $("status");
  s.textContent = text;
  s.className = err ? "err" : "";
}

async function call(path, body) {
  const res = await fetch(path, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.status);
  return data;
}

async function judge(updates) {
  setStatus("Saving…");
  try {
    await call("/api/judge", { updates });
    setStatus("Saved");
  } catch (e) {
    setStatus("Not saved: " + e.message, true);
  }
}

function buildTeams() {
  const by = new Map();
  const add = (r) => {
    const k = r.team + "|" + r.season;
    if (!by.has(k)) by.set(k, { team: r.team, season: +r.season, TeamId: +r.TeamId, idx: [], gone: [] });
    return by.get(k);
  };
  rows.forEach((r, i) => add(r).idx.push(i));
  removed.forEach((r, i) => add(r).gone.push(i));
  teams = [...by.values()].sort((a, b) => a.team.localeCompare(b.team) || a.season - b.season);
  teams.forEach((t) => t.idx.sort((a, b) => rows[a].rank - rows[b].rank));
}

const isNew = (t) => t.idx.filter((i) => rows[i].state === "new").length;
const flagsOn = (t) => t.idx.filter((i) => codes(rows[i]).length).length + t.gone.length;

function renderQueue() {
  const q = $("queue");
  q.replaceChildren();
  const multiSeason = new Set(teams.map((t) => t.season)).size > 1;
  teams.forEach((t, n) => {
    const li = el("li");
    const fresh = isNew(t), flags = flagsOn(t);
    if (!fresh) li.classList.add("done");
    if (n === current) li.classList.add("active");
    li.append(el("span", "name", t.team + (multiSeason ? " " + t.season : "")));
    const right = el("span");
    if (fresh) right.append(el("span", "badge new", `${fresh} new`));
    if (flags) right.append(document.createTextNode(" "), el("span", "badge", String(flags)));
    li.append(right);
    li.onclick = () => go(n);
    q.append(li);
  });
  const done = teams.filter((t) => !isNew(t)).length;
  const fresh = rows.filter((r) => r.state === "new").length;
  const pending = rows.filter((r) => codes(r).length).length;
  $("bar").style.width = (100 * done / Math.max(1, teams.length)) + "%";
  $("progressText").textContent =
    `${done} of ${teams.length} teams up to date · ${fresh} new entries · ${pending + removed.length} flags`;
  const apply = $("apply");
  apply.textContent = pending ? `Apply ${pending} flag${pending > 1 ? "s" : ""}` : "Apply flags";
  apply.disabled = !pending || apply.dataset.running === "1";
}

function otherLists(r) {
  return rows.filter((o) => o.player_id === r.player_id && o.season === r.season && o !== r).length;
}

function facts(r) {
  const f = el("div", "facts");
  const fact = (label, value) => {
    const s = el("span", null, label + " ");
    s.append(el("b", null, value));
    f.append(s);
  };
  fact("age", num(r.age, 0));
  fact("BPM", signed(r.bpm));
  fact("salary", num(r.salary_pct_cap) + "% of cap");
  if (r.rookie_deal === "yes") fact("", "rookie deal");
  fact("replaces", r.replaces || "—");
  if (r.also_sends) fact("+ to match salary", r.also_sends);
  return f;
}

function card(i) {
  const r = rows[i];
  const c = el("div", "card");
  if (codes(r).length) c.classList.add("flagged");
  const top = el("div", "top");
  const left = el("div");
  const title = el("div", "player", `${r.rank}. ${r.player}`);
  if (r.state === "new") title.append(el("span", "tag new", "new"));
  else if (!codes(r).length) title.append(el("span", "tag ok", "ok"));
  left.append(title, facts(r));
  top.append(left);
  const n = otherLists(r);
  top.append(el("span", "elsewhere", n ? `on ${n} other list${n > 1 ? "s" : ""}` : "only here"));
  c.append(top);

  const box = el("div", "reasons");
  Object.entries(reasons).forEach(([code, text]) => {
    const lab = el("label");
    lab.title = text;
    const cb = el("input");
    cb.type = "checkbox";
    cb.checked = codes(r).includes(code);
    if (cb.checked) lab.classList.add("on");
    cb.onchange = () => {
      const set = new Set(codes(r));
      cb.checked ? set.add(code) : set.delete(code);
      r.reason = Object.keys(reasons).filter((k) => set.has(k)).join(";");
      r.state = r.reason ? "flag" : "ok";
      judge([{ ...keyOf(r), reasons: [...set] }]);
      render();
    };
    lab.append(cb, document.createTextNode(code.replace(/_/g, " ")));
    box.append(lab);
  });
  c.append(box);

  const row2 = el("div", "row2");
  const note = el("input");
  note.type = "text";
  note.placeholder = "note: why (this is what becomes a rule)";
  note.value = r.notes || "";
  let timer;
  note.oninput = () => {
    r.notes = note.value;
    clearTimeout(timer);
    timer = setTimeout(() => {
      if (r.state === "new") r.state = "ok";
      judge([{ ...keyOf(r), notes: r.notes }]);
    }, 500);
  };
  row2.append(note);
  if (n) {
    const all = el("button", null, `Apply to all ${n + 1} lists`);
    all.title = "Copy this player's flags and note to every list he is on (player-level judgments)";
    all.hidden = !codes(r).length && !(r.notes || "").trim();
    all.onclick = () => {
      const updates = [];
      rows.forEach((o) => {
        if (o.player_id === r.player_id && o.season === r.season) {
          o.reason = r.reason; o.notes = r.notes; o.state = r.reason ? "flag" : "ok";
          updates.push({ ...keyOf(o), reasons: codes(r), notes: r.notes });
        }
      });
      judge(updates);
      render();
      setStatus(`Applied to ${updates.length} lists`);
    };
    row2.append(all);
  }
  c.append(row2);
  return c;
}

function removedCard(i) {
  const r = removed[i];
  const c = el("div", "card flagged");
  const top = el("div", "top");
  const left = el("div");
  left.append(el("div", "player", r.player), facts(r));
  left.append(el("div", "why", (r.reason || "flagged").replace(/_/g, " ").replace(/;/g, ", ")
    + (r.notes ? " — " + r.notes : "")));
  top.append(left);
  const undo = el("button", null, "Unflag");
  undo.title = "Mark ok; he can return to this list on the next rebuild";
  undo.onclick = async () => {
    await judge([{ ...keyOf(r), reasons: [] }]);
    removed.splice(i, 1);
    buildTeams();
    render();
    setStatus(`${r.player} unflagged; can return on the next rebuild`);
  };
  top.append(undo);
  c.append(top);
  return c;
}

function render() {
  const t = teams[current];
  if (!t) return;
  const first = rows[t.idx[0]];          // team context comes with the live lists
  $("teamName").textContent = `${t.team} · ${t.season}`;
  const ctx = $("context");
  ctx.replaceChildren();
  const add = (label, value) => {
    const s = el("span", null, label + " ");
    s.append(el("b", null, value));
    ctx.append(s);
  };
  if (first) {
    add("net rating", signed(first.team_net_rtg));
    add("rank", first["team_rank (1 = best)"] || "—");
    add("rotation age", num(first.team_age));
    add("payroll", num(first.team_payroll_pct_cap, 0) + "% of cap");
  }
  const main = document.querySelector("main");
  const scroll = main.scrollTop;
  const parts = t.idx.map(card);
  if (t.gone.length) {
    const sec = el("div", "removed");
    sec.append(el("h3", null, `Removed by your flags (${t.gone.length})`));
    t.gone.forEach((i) => sec.append(removedCard(i)));
    parts.push(sec);
  }
  $("cards").replaceChildren(...parts);
  main.scrollTop = scroll;
  $("done").textContent = isNew(t) ? "Mark reviewed & next" : "Next team with new entries";
  renderQueue();
}

function go(n) {
  current = Math.max(0, Math.min(teams.length - 1, n));
  document.querySelector("main").scrollTop = 0;
  render();
}

function nextWithNew(from) {
  const k = teams.findIndex((u, n) => n > from && isNew(u));
  return k >= 0 ? k : teams.findIndex((u) => isNew(u));
}

$("prev").onclick = () => go(current - 1);
$("next").onclick = () => go(current + 1);
$("done").onclick = async () => {
  const t = teams[current];
  if (isNew(t)) {
    try {
      await call("/api/team_done", { season: t.season, TeamId: t.TeamId });
      t.idx.forEach((i) => { if (rows[i].state === "new") rows[i].state = "ok"; });
      setStatus("Saved");
    } catch (e) {
      return setStatus("Not saved: " + e.message, true);
    }
  }
  const k = nextWithNew(current);
  k >= 0 ? go(k) : render();
};

async function load(keepTeam) {
  const data = await (await fetch("/api/review")).json();
  rows = data.rows; removed = data.removed; reasons = data.reasons; jsonPath = data.path;
  const name = keepTeam && teams[current] ? teams[current].team : null;
  buildTeams();
  if (name) current = Math.max(0, teams.findIndex((t) => t.team === name));
  else current = Math.max(0, nextWithNew(-1));
  render();
  return data;
}

$("apply").onclick = async () => {
  const btn = $("apply");
  btn.dataset.running = "1";
  btn.disabled = true;
  setStatus("Rebuilding lists with your flags (about a minute)…");
  await call("/api/apply");
  const poll = setInterval(async () => {
    const job = await (await fetch("/api/job")).json();
    if (job.running) return;
    clearInterval(poll);
    btn.dataset.running = "0";
    await load(true);
    setStatus(job.message, job.ok === false);
  }, 2000);
};

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" && e.target.type === "text") return;
  if (e.key === "ArrowRight" || e.key === "j") go(current + 1);
  if (e.key === "ArrowLeft" || e.key === "k") go(current - 1);
});

(async () => {
  const data = await load(false);
  const legend = $("legend");
  legend.append(el("b", null, "Flag only recommendations that should never be made. "));
  legend.append(document.createTextNode(
    "Decisions are kept: entries you judged before keep their verdict, and only “new” ones need a look. " +
    "“Apply flags” rebuilds the lists without your flags; replacements show up as new. " +
    "← → or j / k move between teams. Saved to " + data.path + "."));
})();
</script>
</body>
</html>
