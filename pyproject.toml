# Tool configuration only. This project is not packaged/installed — the backend
# ships as a container (backend/Dockerfile) and the root scripts run in place —
# so there is deliberately no [project] table and no build-system here.

[tool.ruff]
# The interpreter the stack still runs on (the `recsys` env, the backend image).
# lightfm, which forced 3.9, is retired; pandas==1.2.4 is now what pins it.
target-version = "py39"
line-length = 100

extend-exclude = [
    "nba-recs-frontend",
    "data",
    "local_archive",
]

[tool.ruff.lint]
# Explicit rather than inherited: ruff's default selection has widened across
# releases, so pinning the set keeps a ruff upgrade from turning CI red on its
# own. E/F are pycodestyle+pyflakes, I is import sorting, B is bugbear.
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.isort]
# The backend imports its siblings as top-level modules (`from recommender import
# ...`) because the container makes backend/ the working directory. Without this
# they get sorted into the third-party block, which is wrong and churny.
known-first-party = [
    "app", "helper", "rag", "recommender", "similarity", "vector_index",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=backend --cov-report=term-missing"

[tool.coverage.run]
# compare.py is gitignored one-off scratch (see .gitignore), not shipped code.
omit = ["backend/compare.py"]
