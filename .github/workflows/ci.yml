name: CI

on:
  # PRs targeting main only. A `push` trigger would re-run CI on every commit to
  # a feature branch, which is the same code the PR run already covers.
  # Note GitHub tests the *merge result* (refs/pull/N/merge), not the branch tip,
  # so this checks main-with-your-changes — which is what you actually care about.
  pull_request:
    branches: [main]
  # Post-merge safety net: two PRs can each pass alone and still break main
  # together (a semantic conflict). This fires only on merges to main, never on
  # feature-branch commits.
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      # ruff is a standalone binary — no need to build the heavy runtime deps
      # just to lint, so this job finishes in seconds. Version is pinned to
      # match backend/requirements-dev.txt; a ruff upgrade should be a
      # deliberate commit, not a surprise red build.
      - run: pip install ruff==0.16.6
      - run: ruff check --output-format=github .

  test:
    name: pytest (in the Lambda image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Tests run inside the image rather than on the runner. lightfm==1.17 is an
      # sdist that compiles against numpy at build time and does not install
      # cleanly on a bare runner; containerising is the project's answer to that,
      # so CI exercises the same compiled dependency set the runtime uses.
      # The `test` stage reuses the `deps` layer, so it never downloads the
      # fastembed weights the production image bakes in.
      - name: Build the test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: test
          load: true
          tags: nba-recsys-test:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The suite imports backend/app.py, which loads models_all.joblib and
      # interactions.csv from the repo. Both are tracked, so a plain checkout is
      # enough, and no AWS credentials are needed (rag.py builds its Bedrock
      # client lazily, and nothing under tests/ reaches /ask).
      - name: Run pytest
        run: |
          mkdir -p ci-out
          docker run --rm -v "$PWD/ci-out:/out" nba-recsys-test:ci \
            pytest --cov-report=xml:/out/coverage.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: ci-out/coverage.xml
          if-no-files-found: ignore
