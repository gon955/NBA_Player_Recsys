services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}

  frontend:
    build:
      context: .
      dockerfile: nba-recs-frontend/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
